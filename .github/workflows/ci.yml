name: ✅ CI

on:
  pull_request:
  push:
    branches: [ main ]

# Cancela execuções antigas da mesma branch quando chega um novo push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mesma versão major da produção (Oracle Cloud)
        node-version: [ 24 ]
    name: Node ${{ matrix.node-version }}
    steps:
      - name: 📥 Checkout do código
        # Fixado por SHA (v7) para evitar que uma tag movida execute código não revisado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🟢 Configurando Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 📦 Instalando dependências
        run: npm ci

      - name: 🔎 Typecheck
        run: npm run typecheck

      - name: 🧪 Testes
        run: npm test

      - name: 🏗️ Build
        run: npm run build
